<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Food Shop</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600&display=swap"/>
    <!-- Prerequisite Stylesheets -->
    <link rel="stylesheet" href="navbar.css">
    <link rel="stylesheet" href="oku.css">
    <style>
        html {
            font-size: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            max-width: 1200px;
            margin: 50px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;

        }

        .container h1 {
            font-size: 36px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .container p {
            opacity: 0.9;
            font-size: 16px;

        }

        .card {


            background-color: #FFF5EE;
            border-radius: 20px;
            padding: 25px;
            color: #333;
            transition: 0.3s;
            border: 1px solid #F0F0F0;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .image-container {
            background-color: white;
            height: 180px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            font-size: 60px;
            /* Placeholder for icons */
        }

        .badge {
            display: inline-block;
            background: #FFF5EE;
            color: #D4A373;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .card h3 {
            font-size: 16px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .hero {
            background: linear-gradient(#FF7A2D 100%);
            padding: 60px 20px;
            text-align: center;
            color: white;
        }

        .hero h1 {
            font-size: 2.25rem;
        }

        .hero p {
            font-size: 1rem;
        }

        .price {
            font-size: 0.95rem;
        }

        .buy-btn {
            width: 100%;
            background: linear-gradient(to right, #FF904D, #FF6F22);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(255, 122, 45, 0.3);
        }
    </style>
</head>
<body>

    <!-- Shared Navbar Target Container -->
    <div id="navbar-container"></div>

    <!-- Shop Hero Section -->
    <header class="hero">
        <h1>🛒 Pet Food Shop</h1>
        <p>Quality food & accessories for your furry friends</p>
    </header>

    <!-- Main Grid Container -->
    <div class="container">
        <!-- Card 1: Cat Food -->
        <div class="card">
            <div class="image-container">
                <img src="image/food.jpg" alt="Cat Food">
            </div>
            <h3>Cat Food</h3>
            <p class="price">RM 15.00 – RM 180.00</p>
            <button class="buy-btn" data-keyword="cat food">🛒 Buy Now</button>
        </div>

        <!-- Card 2: Cat Toy -->
        <div class="card">
            <div class="image-container">
                <img src="image/toy.jpg" alt="Cat Toy">
            </div>
            <h3>Cat Toy</h3>
            <p class="price">RM 3.00 – RM 45.00</p>
            <button class="buy-btn" data-keyword="cat toy">🛒 Buy Now</button>
        </div>

        <!-- Card 3: Cat Supplement -->
        <div class="card">
            <div class="image-container">
                <img src="image/supplement.jpg" alt="Cat Supplement">
            </div>
            <h3>Cat Supplement</h3>
            <p class="price">RM 20.00 – RM 85.00</p>
            <button class="buy-btn" data-keyword="cat supplement">🛒 Buy Now</button>
        </div>

        <!-- Card 4: Cat Sand -->
        <div class="card">
            <div class="image-container">
                <img src="image/sand.jpg" alt="Cat Sand">
            </div>
            <h3>Cat Sand</h3>
            <p class="price">RM 12.00 – RM 55.00</p>
            <button class="buy-btn" data-keyword="cat sand">🛒 Buy Now</button>
        </div>
    </div>

    <!-- Script Execution Stack -->
    <script src="navbar.js"></script>
    <script src="shop.js"></script>
    <script src="oku.js"></script>
</body>
</html>
